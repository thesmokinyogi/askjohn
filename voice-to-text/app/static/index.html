<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice-to-Text Transcription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            background: #eef1ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e0e7ff;
            border-color: #4f46e5;
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
        }

        #fileInput {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .results.active {
            display: block;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .confidence {
            background: #10b981;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .confidence.medium {
            background: #f59e0b;
        }

        .confidence.low {
            background: #ef4444;
        }

        .transcript-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            line-height: 1.8;
            color: #333;
            font-size: 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .error {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .filename {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎙️ Voice-to-Text</h1>
        <p class="subtitle">Upload an audio file to transcribe it instantly</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to upload or drag & drop</div>
            <div class="upload-hint">Supports: MP3, WAV, M4A, OGG, FLAC (max 10MB)</div>
            <div class="filename" id="filename"></div>
        </div>

        <input type="file" id="fileInput" accept="audio/*,video/mp4,video/quicktime">

        <button class="btn" id="transcribeBtn" disabled>
            Transcribe Audio
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Transcribing audio... This may take a moment.</p>
        </div>

        <div class="error" id="error"></div>

        <div class="results" id="results">
            <div class="result-header">
                <div class="result-title">Transcript</div>
                <div class="confidence" id="confidence">95% confident</div>
            </div>

            <div class="transcript-box" id="transcript">
                Your transcript will appear here...
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="wordCount">0</div>
                    <div class="stat-label">Words</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="duration">0s</div>
                    <div class="stat-label">Duration</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="segments">0</div>
                    <div class="stat-label">Segments</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const transcribeBtn = document.getElementById('transcribeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const filename = document.getElementById('filename');

        let selectedFile = null;

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // File selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                filename.textContent = selectedFile.name;
                transcribeBtn.disabled = false;
                results.classList.remove('active');
                error.classList.remove('active');
            }
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            if (e.dataTransfer.files.length > 0) {
                selectedFile = e.dataTransfer.files[0];
                filename.textContent = selectedFile.name;
                transcribeBtn.disabled = false;
                results.classList.remove('active');
                error.classList.remove('active');
            }
        });

        // Transcribe button
        transcribeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            // Reset UI
            error.classList.remove('active');
            results.classList.remove('active');
            loading.classList.add('active');
            transcribeBtn.disabled = true;

            // Create form data
            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                // Call API
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Transcription failed');
                }

                // Display results
                displayResults(data);

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('active');
                transcribeBtn.disabled = false;
            }
        });

        function displayResults(data) {
            // Show results section
            results.classList.add('active');

            // Set transcript
            document.getElementById('transcript').textContent = data.transcript;

            // Set confidence
            const confidence = Math.round(data.confidence * 100);
            const confidenceEl = document.getElementById('confidence');
            confidenceEl.textContent = `${confidence}% confident`;

            if (confidence >= 90) {
                confidenceEl.className = 'confidence';
            } else if (confidence >= 70) {
                confidenceEl.className = 'confidence medium';
            } else {
                confidenceEl.className = 'confidence low';
            }

            // Set stats
            document.getElementById('wordCount').textContent = data.word_count;

            if (data.details.words.length > 0) {
                const lastWord = data.details.words[data.details.words.length - 1];
                const duration = Math.round(lastWord.end_time);
                document.getElementById('duration').textContent = `${duration}s`;
            }

            document.getElementById('segments').textContent = data.details.metadata.num_segments || 1;
        }

        function showError(message) {
            error.textContent = `Error: ${message}`;
            error.classList.add('active');
        }
    </script>
</body>
</html>
